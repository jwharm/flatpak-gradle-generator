plugins {
    id 'io.github.jwharm.flatpak-gradle-generator'
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'commons-io:commons-io:2.14.0'

    // should be excluded, because configuration is not in includeConfigurations
    testImplementation('org.jetbrains.kotlin:kotlin-test')
}

tasks.flatpakGradleGenerator {
    outputFile = file('%s')
    includeConfigurations = ['compileClasspath']
}
